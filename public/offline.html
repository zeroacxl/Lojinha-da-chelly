<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="robots" content="noindex, follow" />
    <title>Sem conexão · Chelly Shop ✨</title>
    <meta
      name="description"
      content="Você está offline. Reconecte-se para ver os produtos da Chelly Shop."
    />
    <link rel="icon" href="/icons/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-bottom: calc(24px + env(safe-area-inset-bottom));
        font-family: "DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background:
          radial-gradient(circle at 20% 15%, rgba(244, 63, 94, 0.25), transparent 45%),
          radial-gradient(circle at 80% 85%, rgba(59, 130, 246, 0.25), transparent 45%),
          #0f172a;
        color: #fff;
        text-align: center;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        max-width: 26rem;
        width: 100%;
      }
      .badge {
        width: 5rem;
        height: 5rem;
        margin: 0 auto 1.5rem;
        border-radius: 1.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2.5rem;
        background: linear-gradient(135deg, #f43f5e, #3b82f6);
        box-shadow: 0 18px 40px rgba(244, 63, 94, 0.25);
      }
      h1 {
        font-size: clamp(1.6rem, 6vw, 2.25rem);
        font-weight: 900;
        font-style: italic;
        margin: 0 0 0.75rem;
        line-height: 1.1;
      }
      p {
        margin: 0 auto 2rem;
        max-width: 22rem;
        font-size: 0.9rem;
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.6);
      }
      .actions {
        display: flex;
        flex-direction: column;
        gap: 0.75rem;
      }
      a,
      button {
        display: block;
        width: 100%;
        padding: 1rem 1.25rem;
        border-radius: 1rem;
        font-family: inherit;
        font-size: 0.72rem;
        font-weight: 900;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        text-decoration: none;
        cursor: pointer;
        border: 0;
        transition: transform 0.15s ease, background 0.15s ease;
      }
      a:active,
      button:active {
        transform: scale(0.97);
      }
      .primary {
        background: #fff;
        color: #0f172a;
      }
      .primary:hover {
        background: #f43f5e;
        color: #fff;
      }
      .ghost {
        background: rgba(255, 255, 255, 0.08);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.15);
      }
      .ghost:hover {
        background: rgba(255, 255, 255, 0.16);
      }
      .hint {
        margin-top: 2rem;
        font-size: 0.6rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: rgba(255, 255, 255, 0.3);
      }
      @media (prefers-reduced-motion: reduce) {
        a,
        button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge" aria-hidden="true">📡</div>
      <h1>Você está sem conexão</h1>
      <p>
        O aplicativo está instalado e pronto — assim que a internet voltar, os produtos aparecem
        aqui automaticamente. Nada do que você colocou na sacola foi perdido.
      </p>
      <div class="actions">
        <a class="primary" href="/" id="retry">Tentar novamente</a>
        <a
          class="ghost"
          href="https://wa.me/5506515285426"
          target="_blank"
          rel="noopener noreferrer"
        >
          Falar no WhatsApp
        </a>
      </div>
      <p class="hint">Chelly Shop · Rio Branco — AC</p>
    </main>
    <script>
      // Recarrega quando a conexão voltar (sem depender de clique).
      window.addEventListener("online", function () {
        window.location.reload();
      });
      document.getElementById("retry").addEventListener("click", function (event) {
        if (!navigator.onLine) {
          event.preventDefault();
          this.textContent = "Ainda sem sinal…";
          var self = this;
          setTimeout(function () {
            self.textContent = "Tentar novamente";
          }, 2000);
        }
      });
    </script>
  </body>
</html>
